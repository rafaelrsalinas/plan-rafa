<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Plan Rafa</title>
<style>
/* ===== DESIGN SYSTEM ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f5;--bg2:#e4e7ec;--card:#ffffff;--card-hover:#f8f9fa;
  --text:#0f172a;--text2:#64748b;--text3:#94a3b8;
  --primary:#2563eb;--primary-soft:rgba(37,99,235,.1);--primary-glow:rgba(37,99,235,.25);
  --accent:#8b5cf6;--accent-soft:rgba(139,92,246,.1);
  --success:#10b981;--success-soft:rgba(16,185,129,.1);
  --warning:#f59e0b;--warning-soft:rgba(245,158,11,.1);
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.1);
  --border:rgba(0,0,0,.06);--border2:rgba(0,0,0,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:14px;--radius-sm:10px;--radius-xs:8px;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);
  --header-h:0px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono','Fira Code','Cascadia Code',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.175,.885,.32,1.275);
  --glass:rgba(255,255,255,.7);--glass-border:rgba(255,255,255,.3);
}

[data-theme="dark"]{
  --bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--card-hover:#263548;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
  --primary:#3b82f6;--primary-soft:rgba(59,130,246,.15);--primary-glow:rgba(59,130,246,.3);
  --accent:#a78bfa;--accent-soft:rgba(167,139,250,.15);
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.4);
  --glass:rgba(30,41,59,.8);--glass-border:rgba(255,255,255,.08);
}

html{font-family:var(--font);font-size:15px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  scroll-behavior:smooth}
body{min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  transition:background .3s var(--ease)}

/* ===== TYPOGRAPHY ===== */
.h1{font-size:24px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
.h3{font-size:15px;font-weight:600}
.body{font-size:14px;line-height:1.5}
.caption{font-size:12px;color:var(--text2);line-height:1.4}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===== LAYOUT ===== */
.view{display:none;padding:16px 16px 0;animation:fadeUp .35s var(--ease)}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confetti{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.3) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ===== NAV ===== */
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);
  display:flex;padding-bottom:var(--safe-b);z-index:100}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text3);font-size:10px;font-weight:600;
  letter-spacing:.3px;cursor:pointer;position:relative;transition:color .2s var(--ease);
  -webkit-tap-highlight-color:transparent}
nav button.active{color:var(--primary)}
nav button.active::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--primary)}
nav button svg{width:22px;height:22px;transition:transform .2s var(--ease-spring)}
nav button.active svg{transform:scale(1.1)}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  border:1px solid var(--border);transition:all .2s var(--ease)}
.card-glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border)}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:var(--text2)}
.card-accent{border-left:3px solid var(--primary)}

/* ===== PILLS ===== */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;
  background:var(--bg2);color:var(--text2);border:none;cursor:pointer;
  transition:all .2s var(--ease);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.pill.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow)}
.pill:active{transform:scale(.95)}

/* ===== INPUTS ===== */
.input{width:100%;padding:10px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);
  background:var(--bg);color:var(--text);font-size:14px;font-family:var(--mono);
  transition:all .2s var(--ease);outline:none;-webkit-appearance:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-sm{padding:6px 8px;font-size:13px;text-align:center;width:64px;border-radius:var(--radius-xs)}
.input-sm:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  border:none;cursor:pointer;transition:all .2s var(--ease);
  -webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow)}
.btn-primary:hover{box-shadow:0 4px 16px var(--primary-glow)}
.btn-secondary{background:var(--bg2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger);font-weight:600}
.btn-success{background:var(--success);color:#fff}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--radius-xs)}
.btn-full{width:100%}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%}

/* ===== TOGGLE ===== */
.toggle{position:relative;width:48px;height:28px;cursor:pointer;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle .slider{position:absolute;inset:0;border-radius:14px;background:var(--bg2);
  transition:all .3s var(--ease)}
.toggle .slider::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);
  transition:all .3s var(--ease-spring)}
.toggle input:checked+.slider{background:var(--primary)}
.toggle input:checked+.slider::after{transform:translateX(20px)}

/* ===== CHECKBOX ===== */
.chk{display:flex;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chk input{display:none}
.chk span{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease);flex-shrink:0}
.chk input:checked+span{background:var(--success);border-color:var(--success);
  animation:confetti .3s var(--ease-spring)}
.chk input:checked+span::after{content:'';width:6px;height:10px;border:2px solid #fff;
  border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}

/* ===== PROGRESS RING ===== */
.progress-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.progress-ring .track{stroke:var(--border)}
.progress-ring .fill{stroke:var(--success)}
.progress-ring .center{position:absolute;font-size:13px;font-weight:700}

/* ===== CHRONO / TIMER ===== */
.timer-bar{background:var(--card);border-radius:var(--radius);padding:14px 16px;
  margin-bottom:12px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--border);position:relative;overflow:hidden}
.timer-bar.running{border-color:var(--success);animation:none}
.timer-bar.running::before{content:'';position:absolute;inset:0;
  background:var(--success-soft);animation:pulse 2s ease infinite;pointer-events:none}
.timer-display{font-family:var(--mono);font-size:28px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:110px}
.timer-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.timer-controls{display:flex;gap:8px;margin-left:auto}
.timer-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease);
  -webkit-tap-highlight-color:transparent}
.timer-btn.start{background:var(--success);color:#fff}
.timer-btn.pause{background:var(--warning);color:#fff}
.timer-btn.stop{background:var(--danger-soft);color:var(--danger)}
.timer-btn:active{transform:scale(.9)}

/* ===== REST TIMER ===== */
.rest-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .3s var(--ease)}
.rest-modal{background:var(--card);border-radius:24px;padding:32px;text-align:center;
  width:min(85vw,320px);animation:scaleIn .35s var(--ease-spring)}
.rest-time{font-family:var(--mono);font-size:64px;font-weight:800;color:var(--primary);
  font-variant-numeric:tabular-nums;margin:16px 0}
.rest-bar{height:6px;border-radius:3px;background:var(--bg2);margin:16px 0;overflow:hidden}
.rest-bar-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .3s linear}

/* ===== EXERCISE CARDS ===== */
.ex-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;
  margin-bottom:10px;border:1px solid var(--border);
  transition:all .25s var(--ease);position:relative;overflow:hidden}
.ex-card.completed{opacity:.6}
.ex-card.completed .ex-name::after{content:'';position:absolute;left:0;top:50%;width:100%;
  height:1.5px;background:var(--text3)}
.ex-card.hernia-warn{border-left:3px solid var(--danger)}
.ex-card.hernia-safe{border-left:3px solid var(--success)}
.ex-name{font-size:15px;font-weight:700;margin-bottom:8px;cursor:pointer;position:relative;
  display:inline-block;color:var(--text)}
.ex-name:hover{color:var(--primary)}
.ex-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:4px;vertical-align:middle;margin-left:6px}
.ex-badge.safe{background:var(--success-soft);color:var(--success)}
.ex-badge.warn{background:var(--danger-soft);color:var(--danger)}
.ex-prescribed{font-size:12px;color:var(--text2);margin-bottom:10px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex-prescribed span{background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:500}

.ex-log-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.ex-log-field{display:flex;flex-direction:column;gap:3px}
.ex-log-field label{font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.5px}
.ex-log-field input{width:100%;padding:8px;border-radius:var(--radius-xs);
  border:1.5px solid var(--border2);background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:15px;text-align:center;outline:none;
  transition:all .2s var(--ease);-webkit-appearance:none}
.ex-log-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ex-log-field input::placeholder{color:var(--text3)}

.ex-notes{font-size:12px;color:var(--text2);margin-top:6px;padding:6px 8px;
  background:var(--bg);border-radius:var(--radius-xs);line-height:1.4}

.ex-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--border)}
.ex-rest-btn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  color:var(--primary);cursor:pointer;background:var(--primary-soft);border:none;
  padding:5px 10px;border-radius:6px;transition:all .2s var(--ease)}
.ex-rest-btn:active{transform:scale(.95)}

/* ===== TIMELINE ===== */
.timeline-item{display:flex;gap:12px;padding:10px 0;position:relative}
.timeline-item::before{content:'';position:absolute;left:15px;top:36px;bottom:-10px;
  width:1.5px;background:var(--border)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  background:var(--bg2);transition:all .3s var(--ease)}
.timeline-dot.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px var(--primary-glow)}
.timeline-dot.done{background:var(--success);color:#fff}
.timeline-content{flex:1;min-width:0}
.timeline-time{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text2)}
.timeline-title{font-size:14px;font-weight:600;margin-top:2px}
.timeline-desc{font-size:12px;color:var(--text2);margin-top:1px}

/* ===== MACROS BAR ===== */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.macro-pill{background:var(--card);border-radius:var(--radius-sm);padding:12px 8px;
  text-align:center;border:1px solid var(--border)}
.macro-pill .val{font-size:20px;font-weight:800;font-family:var(--mono)}
.macro-pill .lbl{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.3px;margin-top:2px}
.macro-pill.kcal .val{color:var(--primary)}
.macro-pill.prot .val{color:var(--danger)}
.macro-pill.carb .val{color:var(--warning)}
.macro-pill.fat .val{color:var(--accent)}

/* ===== FOOD ===== */
.food-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);
  gap:8px;font-size:13px}
.food-item:last-child{border-bottom:none}
.food-item .name{flex:1;font-weight:500}
.food-item .macro{font-family:var(--mono);font-size:12px;color:var(--text2);
  background:var(--bg);padding:2px 6px;border-radius:4px;white-space:nowrap}

/* ===== SHOPPING ===== */
.shop-cat{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.shop-item:last-child{border-bottom:none}
.shop-item .qty{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text2);
  background:var(--bg);padding:2px 8px;border-radius:4px}

/* ===== COLLAPSIBLE ===== */
.collapse-btn{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  font-size:14px;font-weight:600;color:var(--text);cursor:pointer;
  transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent}
.collapse-btn::after{content:'';width:8px;height:8px;border-right:2px solid var(--text2);
  border-bottom:2px solid var(--text2);transform:rotate(45deg);transition:transform .3s var(--ease);
  flex-shrink:0}
.collapse-btn.open::after{transform:rotate(-135deg)}
.collapse-btn.open{border-radius:var(--radius) var(--radius) 0 0;border-bottom-color:transparent}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease);
  background:var(--card);border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);padding:0 16px}
.collapse-body.open{max-height:2000px;padding:12px 16px 16px}

/* ===== CONFIG ===== */
.cfg-row{display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--border)}
.cfg-row:last-child{border-bottom:none}
.cfg-label{font-size:14px;font-weight:500}
.cfg-select{padding:8px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);
  background:var(--bg);color:var(--text);font-size:13px;font-weight:500;outline:none;
  -webkit-appearance:none;cursor:pointer}
.num-ctrl{display:flex;align-items:center;gap:2px}
.num-ctrl button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);
  background:var(--bg);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s var(--ease)}
.num-ctrl button:active{background:var(--primary);color:#fff;border-color:var(--primary)}
.num-ctrl span{min-width:36px;text-align:center;font-size:16px;font-weight:700;font-family:var(--mono)}

/* ===== MODAL / OVERLAY ===== */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s var(--ease)}
.modal-overlay.active{display:flex}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;
  max-height:80vh;overflow-y:auto;padding:24px 20px calc(20px + var(--safe-b));
  animation:slideUp .35s var(--ease-spring)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);
  margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:12px}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 20px;font-size:13px;font-weight:600;z-index:500;
  box-shadow:var(--shadow-lg);transition:transform .4s var(--ease-spring);
  display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .toast-icon{font-size:18px}

/* ===== HERNIA ===== */
.hernia-section h4{font-size:13px;font-weight:700;color:var(--primary);margin:12px 0 6px;
  text-transform:uppercase;letter-spacing:.3px}
.hernia-section ul{list-style:none;padding:0}
.hernia-section li{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.hernia-section li:last-child{border-bottom:none}
.hernia-section .detail{color:var(--text2);font-size:12px}

/* ===== EXPORT ===== */
.export-section{margin-top:16px;padding:16px;background:var(--bg);border-radius:var(--radius);
  border:1px dashed var(--border2)}
.export-section h4{font-size:14px;font-weight:700;margin-bottom:4px}
.export-btns{display:flex;gap:8px;margin-top:10px}

/* ===== STATS CARD ===== */
.stat-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.stat-icon{width:40px;height:40px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-content{flex:1}
.stat-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase}

/* ===== HISTORY ===== */
.history-item{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border)}
.history-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.history-info{flex:1;min-width:0}
.history-day{font-size:13px;font-weight:600}
.history-meta{font-size:11px;color:var(--text2)}
.history-duration{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text2)}

/* ===== SECTION HEADER ===== */
.section-header{display:flex;align-items:center;justify-content:space-between;
  margin:16px 0 10px}
.section-header .h3{font-size:13px;color:var(--text2);text-transform:uppercase;
  letter-spacing:.5px}

/* ===== TUPPER ===== */
.tupper-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.tupper-label{font-weight:700;color:var(--text2)}

/* ===== TABLE ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.tbl th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);
  font-weight:700;color:var(--text2);font-size:11px;text-transform:uppercase}
.tbl td{padding:6px;border-bottom:1px solid var(--border)}

/* ===== PREP ===== */
.prep-step{padding:8px 0 8px 20px;border-left:2px solid var(--primary);
  font-size:13px;margin-bottom:4px;position:relative}
.prep-step::before{content:'';position:absolute;left:-5px;top:12px;
  width:8px;height:8px;border-radius:50%;background:var(--primary)}

/* ===== RESPONSIVE ===== */
@media(min-width:768px){
  body{max-width:480px;margin:0 auto}
  nav{max-width:480px;left:50%;transform:translateX(-50%)}
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

<script>
(function(){
'use strict';

/* ===== STATE HELPERS ===== */
const PREFIX = 'pr2_';
const getState = (k, def) => { try { const v = localStorage.getItem(PREFIX+k); return v ? JSON.parse(v) : def; } catch { return def; }};
const setState = (k, v) => localStorage.setItem(PREFIX+k, JSON.stringify(v));
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const weekKey = () => { const d=new Date(); const onejan=new Date(d.getFullYear(),0,1); return `${d.getFullYear()}-W${Math.ceil(((d-onejan)/86400000+onejan.getDay()+1)/7)}`; };
const todayDayName = () => ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][new Date().getDay()];

function getTrainingWeek(){ return getState('tWeek', 1); }
function setTrainingWeek(w){ setState('tWeek', w); }
function getBlockForWeek(w){
  return TRAINING.blocks.find(b => w >= b.weeks[0] && w <= b.weeks[1]) || TRAINING.blocks[0];
}
function getDayMap(){
  return getState('dayMap', {lunes:1,martes:2,miercoles:3,viernes:4});
}
function setDayMap(m){ setState('dayMap', m); }
function isDark(){ return getState('dark', false); }
function getTodayTrainingDay(){
  const dn = todayDayName();
  const dm = getDayMap();
  return dm[dn] || 0;
}

/* ===== TOAST ===== */
let toastTimer;
function showToast(msg, icon=''){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.querySelector('.toast-icon').textContent = icon;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ===== NAV ===== */
const navBtns = document.querySelectorAll('nav button');
const views = document.querySelectorAll('.view');
let currentView = 'v-hoy';

navBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.view;
    if (target === currentView) return;
    navBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    views.forEach(v => { v.classList.remove('active'); });
    document.getElementById(target).classList.add('active');
    currentView = target;
    if (target === 'v-entreno') renderEntreno();
    if (target === 'v-comida') renderComida();
    if (target === 'v-config') renderConfig();
    if (target === 'v-hoy') renderHoy();
  });
});

/* ===== TIMER STATE ===== */
const timerState = { running: false, startTime: null, elapsed: 0, interval: null, paused: false };

function formatTime(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay(){
  const display = document.getElementById('timer-display');
  if (!display) return;
  let total = timerState.elapsed;
  if (timerState.running && timerState.startTime) total += Date.now() - timerState.startTime;
  display.textContent = formatTime(total);
}

function startTimer(){
  if (timerState.running) return;
  timerState.running = true;
  timerState.paused = false;
  timerState.startTime = Date.now();
  timerState.interval = setInterval(updateTimerDisplay, 1000);
  updateTimerUI();
  showToast('Entreno iniciado', '🏋️');
}

function pauseTimer(){
  if (!timerState.running) return;
  timerState.elapsed += Date.now() - timerState.startTime;
  timerState.startTime = null;
  timerState.running = false;
  timerState.paused = true;
  clearInterval(timerState.interval);
  updateTimerUI();
}

function stopTimer(){
  const total = timerState.elapsed + (timerState.running && timerState.startTime ? Date.now() - timerState.startTime : 0);
  clearInterval(timerState.interval);
  timerState.running = false;
  timerState.paused = false;
  timerState.startTime = null;

  if (total > 60000) {
    const week = entState.week;
    const day = entState.day;
    const key = todayKey();
    const sessions = getState('sessions', []);
    sessions.push({ date: key, week, day, duration: total, block: entState.block });
    setState('sessions', sessions);
    // Save timer for today
    setState('timer_' + key + '_' + week + '-' + day, total);
    showToast(`Sesion guardada: ${formatTime(total)}`, '✅');
  }

  timerState.elapsed = 0;
  updateTimerDisplay();
  updateTimerUI();
}

function updateTimerUI(){
  const bar = document.getElementById('ent-timer');
  const startBtn = document.getElementById('timer-start');
  const pauseBtn = document.getElementById('timer-pause');
  const stopBtn = document.getElementById('timer-stop');
  if (!bar) return;

  if (timerState.running) {
    bar.classList.add('running');
    startBtn.style.display = 'none';
    pauseBtn.style.display = 'flex';
    stopBtn.style.display = 'flex';
  } else if (timerState.paused) {
    bar.classList.remove('running');
    startBtn.style.display = 'flex';
    pauseBtn.style.display = 'none';
    stopBtn.style.display = 'flex';
  } else {
    bar.classList.remove('running');
    startBtn.style.display = 'flex';
    pauseBtn.style.display = 'none';
    stopBtn.style.display = 'none';
  }
}

/* ===== REST TIMER ===== */
let restInterval = null;
let restRemaining = 0;
let restTotal = 0;

function startRestTimer(seconds, exerciseName){
  restTotal = seconds;
  restRemaining = seconds;
  document.getElementById('rest-exercise').textContent = exerciseName;
  document.getElementById('rest-overlay').style.display = 'flex';
  updateRestDisplay();
  restInterval = setInterval(() => {
    restRemaining--;
    updateRestDisplay();
    if (restRemaining <= 0) {
      stopRestTimer();
      showToast('Descanso terminado!', '⏰');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function updateRestDisplay(){
  const m = Math.floor(restRemaining / 60);
  const s = restRemaining % 60;
  document.getElementById('rest-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const pct = ((restTotal - restRemaining) / restTotal) * 100;
  document.getElementById('rest-bar-fill').style.width = pct + '%';
}

function stopRestTimer(){
  clearInterval(restInterval);
  document.getElementById('rest-overlay').style.display = 'none';
}

document.getElementById('rest-skip').addEventListener('click', stopRestTimer);
document.getElementById('rest-add30').addEventListener('click', () => {
  restRemaining += 30;
  restTotal += 30;
  updateRestDisplay();
});

/* ===== PROGRESS RING ===== */
function makeRing(pct, size=52, stroke=5){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return `<div class="progress-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <span class="center">${Math.round(pct)}%</span>
  </div>`;
}

/* ===== HERNIA CHECK ===== */
function isHerniaProhibited(name){
  if (!HERNIA || !HERNIA.prohibited) return false;
  const n = name.toLowerCase();
  return HERNIA.prohibited.some(p => n.includes(p.item.toLowerCase().split(' ')[0]));
}
function isHerniaSafe(name){
  if (!HERNIA || !HERNIA.safeCore) return false;
  const n = name.toLowerCase();
  return HERNIA.safeCore.some(p => n.includes(p.item.toLowerCase().split(' ')[0]));
}

/* ===== PARSE REST TIME ===== */
function parseRestSeconds(rest){
  if (!rest || rest === '--') return 60;
  const s = rest.toLowerCase().replace(/\s/g,'');
  if (s.includes('min')) {
    const n = parseFloat(s);
    return isNaN(n) ? 60 : n * 60;
  }
  if (s.includes('s')) {
    const n = parseInt(s);
    return isNaN(n) ? 60 : n;
  }
  const n = parseFloat(s);
  return isNaN(n) ? 60 : (n > 10 ? n : n * 60);
}

/* ===== HOY VIEW ===== */
function renderHoy(){
  const now = new Date();
  const h = now.getHours();
  let greet = 'Buenos dias';
  if (h >= 14 && h < 21) greet = 'Buenas tardes';
  if (h >= 21 || h < 6) greet = 'Buenas noches';
  document.getElementById('hoy-greeting').textContent = greet + ', Rafa';

  const opts = {weekday:'long',day:'numeric',month:'long'};
  document.getElementById('hoy-date').textContent = now.toLocaleDateString('es-ES', opts);

  const week = getTrainingWeek();
  const block = getBlockForWeek(week);
  document.getElementById('hoy-week-label').textContent = `Semana ${week} de 18`;
  document.getElementById('hoy-block-label').textContent = `Bloque ${block.id}: ${block.name}`;

  const td = getTodayTrainingDay();
  const dn = todayDayName();
  document.getElementById('hoy-day-type').textContent = td > 0
    ? `${TRAINING.days[td-1]}` : (dn === 'sabado' || dn === 'domingo') ? 'Fin de semana' : 'Descanso';

  // Today progress ring
  if (td > 0) {
    const key = `${week}-${td}`;
    const exercises = TRAINING.workouts[key];
    if (exercises) {
      const doneKey = 'exdone_' + todayKey() + '_' + key;
      const done = getState(doneKey, {});
      const total = exercises.length;
      const completed = Object.values(done).filter(Boolean).length;
      const pct = total > 0 ? (completed / total) * 100 : 0;
      document.getElementById('hoy-ring').innerHTML = makeRing(pct, 56, 5);
    } else {
      document.getElementById('hoy-ring').innerHTML = '';
    }
  } else {
    document.getElementById('hoy-ring').innerHTML = makeRing(0, 56, 5);
  }

  // Timeline
  renderTimeline(td, h);
}

/* ===== SCHEDULE DATA ===== */
const SCHEDULE_LV = [
  {time:'06:00',icon:'☀️',title:'Despertar + luz solar',desc:'10 min luz natural directa'},
  {time:'06:15',icon:'🧠',title:'Suplementos manana',desc:'Omega 3 + Melena de leon'},
  {time:'06:30',icon:'🥣',title:'Desayuno',desc:'Avena + whey + fruta'},
  {time:'07:00',icon:'🚒',title:'Trabajo',desc:''},
  {time:'10:30',icon:'🥤',title:'Snack media manana',desc:'Kefir o fruta + proteina'},
  {time:'13:00',icon:'🍱',title:'Comida + D3+K2',desc:'Tupper del dia'},
  {time:'16:00',icon:'💊',title:'Pre-entreno',desc:'Creatina + cafe (si entrenas)'},
  {time:'17:00',icon:'🏋️',title:'Entrenamiento',desc:'Segun programacion semanal'},
  {time:'18:30',icon:'🥤',title:'Post-entreno',desc:'Whey + platano (apto)'},
  {time:'19:30',icon:'🍽️',title:'Cena',desc:'Proteina + verdura ligera'},
  {time:'21:00',icon:'💊',title:'Suplementos noche',desc:'Magnesio 400mg + ZMA'},
  {time:'21:30',icon:'📱',title:'Desconexion digital',desc:'Sin pantallas'},
  {time:'22:00',icon:'😴',title:'Dormir',desc:'Objetivo 7.5-8h'},
];

const SCHEDULE_FDS = [
  {time:'07:30',icon:'☀️',title:'Despertar + luz solar',desc:'Sin alarma. Luz natural'},
  {time:'08:00',icon:'🥣',title:'Desayuno',desc:'Mas tranquilo'},
  {time:'09:00',icon:'🚶',title:'Rucking / Actividad',desc:'Paseo con mochila lastrada o deporte'},
  {time:'13:00',icon:'🍱',title:'Comida + D3+K2',desc:''},
  {time:'16:00',icon:'🥤',title:'Snack',desc:'Kefir o fruta'},
  {time:'19:30',icon:'🍽️',title:'Cena',desc:'Proteina + verdura'},
  {time:'21:00',icon:'💊',title:'Suplementos noche',desc:'Magnesio 400mg + ZMA'},
  {time:'22:00',icon:'😴',title:'Dormir',desc:''},
];

function renderTimeline(td, currentHour){
  const dn = todayDayName();
  const isFds = dn === 'sabado' || dn === 'domingo';
  const sched = isFds ? SCHEDULE_FDS : SCHEDULE_LV;

  let html = '';
  sched.forEach((item, i) => {
    const itemH = parseInt(item.time.split(':')[0]);
    const nextH = i < sched.length - 1 ? parseInt(sched[i+1].time.split(':')[0]) : 24;
    const isActive = currentHour >= itemH && currentHour < nextH;
    const isDone = currentHour > nextH || (currentHour === nextH && i < sched.length - 1);

    html += `<div class="timeline-item">
      <div class="timeline-dot ${isActive ? 'active' : isDone ? 'done' : ''}">${item.icon}</div>
      <div class="timeline-content">
        <div class="timeline-time">${item.time}</div>
        <div class="timeline-title">${item.title}</div>
        ${item.desc ? `<div class="timeline-desc">${item.desc}</div>` : ''}
      </div>
    </div>`;
  });
  document.getElementById('hoy-timeline').innerHTML = html;
}

/* ===== ENTRENO VIEW ===== */
const entState = { block: 'A', week: 1, day: 1 };

function renderEntreno(){
  entState.week = getTrainingWeek();
  entState.block = getBlockForWeek(entState.week).id;

  const td = getTodayTrainingDay();
  if (td > 0) entState.day = td;

  const block = getBlockForWeek(entState.week);
  document.getElementById('ent-subtitle').textContent =
    `Bloque ${block.id}: ${block.name} — Semana ${entState.week}`;

  updateTimerDisplay();
  updateTimerUI();

  // Timer events
  document.getElementById('timer-start').onclick = startTimer;
  document.getElementById('timer-pause').onclick = pauseTimer;
  document.getElementById('timer-stop').onclick = stopTimer;

  // Blocks
  let bhtml = '';
  TRAINING.blocks.forEach(b => {
    bhtml += `<button class="pill ${b.id === entState.block ? 'active' : ''}" data-block="${b.id}">${b.id}</button>`;
  });
  document.getElementById('ent-blocks').innerHTML = bhtml;
  document.getElementById('ent-blocks').querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      const b = TRAINING.blocks.find(x => x.id === p.dataset.block);
      entState.block = b.id;
      entState.week = b.weeks[0];
      renderEntWeeks();
      renderEntDays();
      renderExercises();
      renderEntProgress();
    });
  });

  renderEntWeeks();
  renderEntDays();
  renderExercises();
  renderEntProgress();
  renderHistory();
}

function renderEntWeeks(){
  const b = TRAINING.blocks.find(x => x.id === entState.block);
  let html = '';
  for (let w = b.weeks[0]; w <= b.weeks[1]; w++) {
    html += `<button class="pill ${w === entState.week ? 'active' : ''}" data-w="${w}">S${w}</button>`;
  }
  document.getElementById('ent-weeks').innerHTML = html;
  document.getElementById('ent-weeks').querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      entState.week = parseInt(p.dataset.w);
      renderEntWeeks();
      renderExercises();
      renderEntProgress();
    });
  });
}

function renderEntDays(){
  let html = '';
  TRAINING.days.forEach((d, i) => {
    const num = i + 1;
    const short = d.split(' ')[0];
    html += `<button class="pill ${num === entState.day ? 'active' : ''}" data-d="${num}">${short}</button>`;
  });
  document.getElementById('ent-days').innerHTML = html;
  document.getElementById('ent-days').querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      entState.day = parseInt(p.dataset.d);
      renderEntDays();
      renderExercises();
      renderEntProgress();
    });
  });
}

function renderEntProgress(){
  const key = `${entState.week}-${entState.day}`;
  const exercises = TRAINING.workouts[key];
  if (!exercises) { document.getElementById('ent-progress').innerHTML = ''; return; }

  const doneKey = 'exdone_' + todayKey() + '_' + key;
  const done = getState(doneKey, {});
  const total = exercises.length;
  const completed = Object.values(done).filter(Boolean).length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('ent-progress').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:4px 0">
      <div style="flex:1;height:6px;border-radius:3px;background:var(--bg2);overflow:hidden">
        <div style="height:100%;width:${pct}%;border-radius:3px;background:var(--success);transition:width .4s var(--ease)"></div>
      </div>
      <span class="caption mono">${completed}/${total}</span>
    </div>`;
}

/* ===== EXERCISE LOG DEBOUNCE ===== */
let _exLogDebounce = null;
function saveExLog(logKey, idx, field, value){
  clearTimeout(_exLogDebounce);
  _exLogDebounce = setTimeout(() => {
    const log = getState(logKey, {});
    if (!log[idx]) log[idx] = {};
    if (value === '' || value === null) {
      delete log[idx][field];
    } else {
      log[idx][field] = isNaN(Number(value)) ? value : Number(value);
    }
    setState(logKey, log);
  }, 300);
}

/* ===== RENDER EXERCISES ===== */
function renderExercises(){
  const key = `${entState.week}-${entState.day}`;
  const exercises = TRAINING.workouts[key];
  const container = document.getElementById('ent-exercises');
  if (!exercises) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px"><div class="caption">No hay ejercicios para esta combinacion</div></div>';
    return;
  }

  const doneKey = 'exdone_' + todayKey() + '_' + key;
  const done = getState(doneKey, {});
  const logKey = 'exlog_' + todayKey() + '_' + key;
  const log = getState(logKey, {});

  let html = '';
  exercises.forEach((ex, i) => {
    const warn = isHerniaProhibited(ex.name);
    const safe = isHerniaSafe(ex.name);
    const isDone = done[i];
    const l = log[i] || {};

    const weightVal = l.weight != null ? l.weight : '';
    const repsVal = l.reps != null ? l.reps : '';
    const rpeVal = l.rpe != null ? l.rpe : '';

    const weightPh = ex.weight && ex.weight !== '--' ? ex.weight : 'kg';
    const rpePh = ex.rpe && ex.rpe !== '--' ? ex.rpe : 'RPE';
    const repsPh = ex.sets || 'reps';

    const restSec = parseRestSeconds(ex.rest);

    html += `<div class="ex-card ${isDone ? 'completed' : ''} ${warn ? 'hernia-warn' : safe ? 'hernia-safe' : ''}">
      <div class="ex-name" data-glossary="${ex.name}">${ex.name}
        ${safe ? '<span class="ex-badge safe">SAFE</span>' : ''}
        ${warn ? '<span class="ex-badge warn">CUIDADO</span>' : ''}
      </div>

      <div class="ex-prescribed">
        <span>${ex.sets || '--'}</span>
        ${ex.weight && ex.weight !== '--' ? `<span>${ex.weight}kg</span>` : ''}
        ${ex.rest && ex.rest !== '--' ? `<span>⏱ ${ex.rest}</span>` : ''}
        ${ex.rpe && ex.rpe !== '--' ? `<span>RPE ${ex.rpe}</span>` : ''}
        ${ex.tempo && ex.tempo !== '--' ? `<span>${ex.tempo}</span>` : ''}
      </div>

      <div class="ex-log-grid">
        <div class="ex-log-field">
          <label>Peso (kg)</label>
          <input type="number" step="0.5" inputmode="decimal"
            data-logkey="${logKey}" data-idx="${i}" data-field="weight"
            value="${weightVal}" placeholder="${weightPh}">
        </div>
        <div class="ex-log-field">
          <label>Reps</label>
          <input type="number" step="1" inputmode="numeric"
            data-logkey="${logKey}" data-idx="${i}" data-field="reps"
            value="${repsVal}" placeholder="${repsPh}">
        </div>
        <div class="ex-log-field">
          <label>RPE</label>
          <input type="number" step="0.5" min="1" max="10" inputmode="decimal"
            data-logkey="${logKey}" data-idx="${i}" data-field="rpe"
            value="${rpeVal}" placeholder="${rpePh}">
        </div>
      </div>

      ${ex.notes ? `<div class="ex-notes">📝 ${ex.notes}</div>` : ''}
      ${warn ? '<div class="ex-notes" style="color:var(--danger)">⚠️ Posible riesgo hernia — revisar alternativas</div>' : ''}

      <div class="ex-footer">
        <label class="chk"><input type="checkbox" data-donekey="${doneKey}" data-idx="${i}" ${isDone ? 'checked' : ''}><span></span>
          <span style="font-size:12px;color:var(--text2);margin-left:6px">Hecho</span>
        </label>
        ${ex.rest && ex.rest !== '--' ? `<button class="ex-rest-btn" data-rest="${restSec}" data-name="${ex.name}">⏱ ${ex.rest}</button>` : ''}
      </div>
    </div>`;
  });

  container.innerHTML = html;

  // Event listeners
  container.querySelectorAll('.ex-name').forEach(el => {
    el.addEventListener('click', () => showGlossary(el.dataset.glossary));
  });
  container.querySelectorAll('.ex-log-grid input').forEach(inp => {
    inp.addEventListener('input', () => {
      saveExLog(inp.dataset.logkey, inp.dataset.idx, inp.dataset.field, inp.value);
    });
  });
  container.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const s = getState(cb.dataset.donekey, {});
      s[cb.dataset.idx] = cb.checked;
      setState(cb.dataset.donekey, s);
      cb.closest('.ex-card').classList.toggle('completed', cb.checked);
      renderEntProgress();
      if (cb.checked) showToast('Ejercicio completado', '💪');
    });
  });
  container.querySelectorAll('.ex-rest-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      startRestTimer(parseInt(btn.dataset.rest), btn.dataset.name);
    });
  });
}

/* ===== GLOSSARY ===== */
function showGlossary(name){
  if (!GLOSSARY) return;
  const entry = GLOSSARY.find(g => g.name && name.toLowerCase().includes(g.name.toLowerCase().split(' ')[0]));
  const modal = document.getElementById('glossary-modal');
  document.getElementById('glossary-title').textContent = name;
  if (entry) {
    let body = '';
    if (entry.category) body += `<p><strong>Categoria:</strong> ${entry.category}</p>`;
    if (entry.muscles) body += `<p><strong>Musculos:</strong> ${entry.muscles}</p>`;
    if (entry.description) body += `<p>${entry.description}</p>`;
    if (entry.herniaNote) body += `<p style="color:var(--warning)"><strong>Nota hernia:</strong> ${entry.herniaNote}</p>`;
    document.getElementById('glossary-body').innerHTML = body || '<p>Sin informacion adicional.</p>';
  } else {
    document.getElementById('glossary-body').innerHTML = '<p>Sin informacion en el glosario para este ejercicio.</p>';
  }
  modal.classList.add('active');
}

document.getElementById('glossary-modal').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('active');
});

/* ===== HISTORY ===== */
function renderHistory(){
  const sessions = getState('sessions', []);
  const container = document.getElementById('ent-history');
  if (sessions.length === 0) { container.innerHTML = ''; return; }

  const recent = sessions.slice(-5).reverse();
  let html = `<div class="section-header"><span class="h3">Historial reciente</span></div><div class="card">`;
  recent.forEach(s => {
    const block = getBlockForWeek(s.week);
    const dayName = TRAINING.days[s.day - 1] || '?';
    html += `<div class="history-item">
      <div class="history-dot" style="background:var(--primary)"></div>
      <div class="history-info">
        <div class="history-day">${dayName.split(' ')[0]}</div>
        <div class="history-meta">S${s.week} · Bloque ${s.block} · ${s.date}</div>
      </div>
      <div class="history-duration">${formatTime(s.duration)}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

    <div class="cfg-row" style="margin-top:8px">
      <span class="cfg-label">Modo oscuro</span>
      <label class="toggle"><input type="checkbox" id="cfg-dark" ${dark ? 'checked' : ''}><span class="slider"></span></label>
    </div>`;

  // Hernia section
  html += `<div style="margin-top:16px">`;
  let herniaContent = '';
  if (HERNIA) {
    herniaContent += '<h4>Ejercicios prohibidos</h4><ul>';
    (HERNIA.prohibited||[]).forEach(p => { herniaContent += `<li>${p.item} <span class="detail">— ${p.detail}</span></li>`; });
    herniaContent += '</ul><h4>Core seguro</h4><ul>';
    (HERNIA.safeCore||[]).forEach(p => { herniaContent += `<li>${p.item} <span class="detail">— ${p.detail}</span></li>`; });
    herniaContent += '</ul><h4>Reglas sprint</h4><ul>';
    (HERNIA.sprintRules||[]).forEach(p => { herniaContent += `<li>${p.item} <span class="detail">— ${p.detail}</span></li>`; });
    herniaContent += '</ul><h4>Estiramientos</h4><ul>';
    (HERNIA.stretching||[]).forEach(p => { herniaContent += `<li>${p.item} <span class="detail">— ${p.detail}</span></li>`; });
    herniaContent += '</ul>';
  }
  html += collapsible('🦴 Reglas hernia discal L5-S1', `<div class="hernia-section">${herniaContent}</div>`);
  html += `</div>`;

  // Stats
  const sessions = getState('sessions', []);
  if (sessions.length > 0) {
    const totalTime = sessions.reduce((a,s) => a + s.duration, 0);
    html += `<div class="section-header"><span class="h3">Estadisticas</span></div>
    <div class="card">
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--primary-soft)">🏋️</div>
        <div class="stat-content">
          <div class="stat-value">${sessions.length}</div>
          <div class="stat-label">Sesiones totales</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--success-soft)">⏱</div>
        <div class="stat-content">
          <div class="stat-value">${formatTime(totalTime)}</div>
          <div class="stat-label">Tiempo total</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--accent-soft)">📊</div>
        <div class="stat-content">
          <div class="stat-value">${formatTime(Math.round(totalTime / sessions.length))}</div>
          <div class="stat-label">Media por sesion</div>
        </div>
      </div>
    </div>`;
  }

  // Export / Import
  html += `<div class="export-section">
    <h4>💾 Datos de entrenamiento</h4>
    <p class="caption" style="margin:4px 0 10px">Exporta registros para transferir a otro dispositivo</p>
    <div class="export-btns">
      <button class="btn btn-primary btn-sm" id="cfg-export">Exportar</button>
      <button class="btn btn-secondary btn-sm" id="cfg-import-btn">Importar</button>
      <input type="file" id="cfg-import-file" accept=".json" style="display:none">
    </div>
  </div>`;

  html += `<button class="btn btn-danger btn-full" id="cfg-reset" style="margin-top:16px">Resetear todos los datos</button>`;

  document.getElementById('cfg-content').innerHTML = html;

  // Events
  document.getElementById('cfg-w-minus').addEventListener('click', () => {
    let w = getTrainingWeek();
    if (w > 1) { setTrainingWeek(w - 1); renderConfig(); }
  });
  document.getElementById('cfg-w-plus').addEventListener('click', () => {
    let w = getTrainingWeek();
    if (w < 18) { setTrainingWeek(w + 1); renderConfig(); }
  });
  document.getElementById('cfg-dark').addEventListener('change', function() {
    setState('dark', this.checked);
    applyTheme();
    showToast(this.checked ? 'Modo oscuro activado' : 'Modo claro activado', this.checked ? '🌙' : '☀️');
  });
  document.querySelectorAll('.cfg-day-sel').forEach(sel => {
    sel.addEventListener('change', () => {
      const newMap = {};
      document.querySelectorAll('.cfg-day-sel').forEach(s => {
        newMap[s.value] = parseInt(s.dataset.daynum);
      });
      setDayMap(newMap);
      showToast('Dias actualizados', '📅');
    });
  });
  document.getElementById('cfg-export').addEventListener('click', () => {
    const data = { version: 2, exportDate: todayKey(), storage: {} };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PREFIX)) data.storage[k] = JSON.parse(localStorage.getItem(k));
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `planrafa_backup_${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Datos exportados', '💾');
  });
  document.getElementById('cfg-import-btn').addEventListener('click', () => {
    document.getElementById('cfg-import-file').click();
  });
  document.getElementById('cfg-import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.storage) {
          Object.entries(data.storage).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v)));
        }
        // Support v1 format
        if (data.logs) Object.entries(data.logs).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v)));
        if (data.timers) Object.entries(data.timers).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v)));
        showToast('Datos importados correctamente', '✅');
        renderConfig();
      } catch { showToast('Error al leer el archivo', '❌'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('cfg-reset').addEventListener('click', () => {
    if (confirm('¿Seguro que quieres borrar TODOS los datos guardados? Esta accion no se puede deshacer.')) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(PREFIX) || k.startsWith('pr_')) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      applyTheme();
      renderConfig();
      showToast('Datos reseteados', '🗑️');
    }
  });
}

/* ===== THEME ===== */
function applyTheme(){
  const dark = isDark();
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? '#0f172a' : '#f0f2f5';
}

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ===== INIT ===== */
applyTheme();
renderHoy();

})();
</script>
</body>
</html>
